# ==============================================================================
# OpenObserve SRE Shipper Configuration
# ==============================================================================

server:
  host: "0.0.0.0"
  port: 8089

deduplication:
  cooldown_seconds: 1800 # 30 minutes cooldown for identical error signatures

agent_dispatch:
  # Target agent webhook (Aina AGY Mesh runner or standard HTTP webhook)
  target_url: "http://localhost:8000/webhook/agent-remediation"
  auth_token: ""

# Registry mapping 20+ apps to their GitHub repositories and verification commands
applications:
  toko-online-api:
    repo_url: "https://github.com/myorg/toko-online-api"
    default_branch: "main"
    language: "php"
    framework: "laravel"
    verification_command: "php artisan test"

  pos-kasir:
    repo_url: "https://github.com/myorg/pos-kasir"
    default_branch: "main"
    language: "typescript"
    framework: "nextjs"
    verification_command: "npm test"

  billing-service:
    repo_url: "https://github.com/myorg/billing-service"
    default_branch: "main"
    language: "python"
    framework: "fastapi"
    verification_command: "pytest"
